apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-service
spec:
  ingressClassName: nginx
  rules:
  - host: nginx.test.com
    http:
         paths:
         - path: /
           pathType: Prefix
           backend:
               service:
                  name: nginx-service
                  port:
                       name: http
               
                          